<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Hotel lobby background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f5f51"/>
      <stop offset="48%" stop-color="#8b7b69"/>
      <stop offset="100%" stop-color="#4f4339"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dfeaf2" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#9eb8c9" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#f8e3b2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f8e3b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="90" y="140" width="1420" height="400" rx="16" fill="url(#glass)"/>
  <rect x="0" y="560" width="1600" height="340" fill="#3c3028"/>

  <rect x="180" y="170" width="80" height="630" fill="#b9a588"/>
  <rect x="1340" y="170" width="80" height="630" fill="#b9a588"/>
  <rect x="560" y="210" width="70" height="590" fill="#c6b191"/>
  <rect x="970" y="210" width="70" height="590" fill="#c6b191"/>

  <ellipse cx="800" cy="285" rx="300" ry="180" fill="url(#light)"/>
  <line x1="800" y1="110" x2="800" y2="230" stroke="#b69357" stroke-width="8"/>
  <ellipse cx="800" cy="320" rx="120" ry="120" fill="none" stroke="#c9a86d" stroke-width="8"/>
  <ellipse cx="800" cy="400" rx="180" ry="100" fill="none" stroke="#c9a86d" stroke-width="6"/>

  <circle cx="720" cy="315" r="16" fill="#ffe6b6"/>
  <circle cx="880" cy="315" r="16" fill="#ffe6b6"/>
  <circle cx="760" cy="392" r="14" fill="#ffe6b6"/>
  <circle cx="840" cy="392" r="14" fill="#ffe6b6"/>

  <rect x="260" y="590" width="1080" height="220" fill="#2f2520"/>
  <rect x="300" y="620" width="1000" height="26" fill="#cf5d42" fill-opacity="0.5"/>
  <rect x="300" y="670" width="1000" height="18" fill="#f1bc6e" fill-opacity="0.35"/>
</svg>
